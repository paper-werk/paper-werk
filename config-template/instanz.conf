# Was diese Installation mitbringt. Gelesen von stack.sh in paper-werk.
#
#   PROJEKT      Name für `docker compose -p`. Er steht in den Containernamen
#                und in den Labels; wer ihn ändert, hat einen zweiten Stack.
#   HTTPS        "ja" nimmt compose/compose.https.yml dazu. Dann müssen in
#                .env PAPER_WERK_HOSTNAME und PAPER_WERK_TLS_MODE stehen.
#   PROFILE      Compose-Profile, mit Leerzeichen getrennt (z. B. "werkzeuge").
#   ZUSATZ       Eigene Compose-Dateien aus DIESEM Ordner, die dazukommen.
#                compose.override.yml wird ohne Eintrag berücksichtigt.
#   ZUSATZREPOS  Git-Repos mit eingehängten Apps (relativ zu diesem Ordner),
#                die setup/aktualisieren.sh mitzieht.
#   APP_BAUEN    "ja" baut paper-werk-app aus dem Quelltext (compose/compose.build.yml)
#                statt das Image aus der Registry zu laden.

PROJEKT=paper-werk
HTTPS=nein
PROFILE=""
ZUSATZ=""
ZUSATZREPOS=""
APP_BAUEN=nein
